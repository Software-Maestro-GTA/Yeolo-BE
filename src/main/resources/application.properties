spring.application.name=yeolo

# ===== Graceful shutdown =====
# 롤링 배포/종료 시 진행 중인 SSE 파이프라인이 끊기지 않도록 graceful 종료한다.
# 파드 grace(90s) - preStop(15s) = 75s 안쪽이라 이 값이 상한이다. SSE 스트림 상한
# (sse.stream-timeout-ms)보다는 짧으므로, 배포 시점에 진행 중이던 긴 스트림은 끊길 수 있다 —
# 파드 grace를 늘리지 않는 한 BE에서 더 기다릴 수 없다(인프라 담당 영역).
# 다만 저장은 워커가 마치므로 재요청 시 재분석 없이 이어진다.
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=60s

# ===== DataSource =====
# 드라이버는 URL 스킴(PostgreSQL)으로 자동 판별. 드라이버 클래스 하드코딩 금지.
# Hibernate dialect 도 커넥션 메타데이터로 자동 선택되므로 명시하지 않는다.
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/yeolo}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}

# ===== Logging =====
# 접근 로그(RequestLoggingFilter)가 요청마다 발급하는 requestId를 로그 레벨 옆에 표시해
# 같은 요청의 진입(-->)·완료(<--)·중간 로그를 한 눈에 짝지을 수 있게 한다.
logging.pattern.level=%5p [%X{requestId:-}]

# ===== Actuator (k8s health probes) =====
# 인프라 Deployment 가 /actuator/health/readiness, /actuator/health/liveness 를 probe 로 호출한다.
# probes.enabled=true 로 readiness/liveness 헬스 그룹을 명시적으로 활성화(k8s 자동감지에 의존하지 않음).
management.endpoint.health.probes.enabled=true
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never

# ===== JPA =====
# 스키마는 엔티티가 근거. local·dev=update, prod=validate (docs/architecture.md 2)
# dev가 update인 것은 스키마가 자주 바뀌기 때문이다. update는 '추가만' 하므로 컬럼 삭제·이름/타입
# 변경은 반영되지 않고, 그 드리프트는 prod의 validate에서 처음 드러난다 — DDL은 계속 docs/ddl에 남긴다.
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true

# ===== 프로필 이미지 업로드 (API-USER-1) =====
# provider: stub(기본) | s3. stub은 외부 호출 없이 합성 URL만 돌려주므로 실제 이미지가 열리지 않는다 —
# dev/prod는 반드시 s3로 설정한다. s3는 버킷·공개 base URL과 IRSA(ServiceAccount↔IAM Role) 권한이
# 전제이며(인프라 담당), 액세스 키는 앱 설정으로 받지 않는다(SDK 기본 자격증명 체인).
profile-image.provider=${PROFILE_IMAGE_PROVIDER:stub}
# 앱 정책 한도. 초과 시 명세의 413. 아래 컨테이너 한도보다 작아야 이 검사가 먼저 걸린다.
profile-image.max-bytes=${PROFILE_IMAGE_MAX_BYTES:5242880}
profile-image.s3.bucket=${PROFILE_IMAGE_S3_BUCKET:}
# 비우면 SDK 기본 리전 체인(AWS_REGION 등)을 따른다.
profile-image.s3.region=${PROFILE_IMAGE_S3_REGION:}
# 저장된 객체를 공개 제공하는 기준 URL(CloudFront 도메인 등). 끝 슬래시 없이.
profile-image.s3.base-url=${PROFILE_IMAGE_BASE_URL:}
profile-image.s3.key-prefix=${PROFILE_IMAGE_KEY_PREFIX:profile-images}

# ===== Multipart (API-USER-1) =====
# 컨테이너 한도(1차 방어선). profile-image.max-bytes 보다 크게 둬서, 정상 범위의 초과는 앱이
# 명세 문구로 413을 내고 터무니없이 큰 요청만 파싱 단계에서 끊기게 한다(두 경로 모두 413).
spring.servlet.multipart.max-file-size=${MULTIPART_MAX_FILE_SIZE:8MB}
spring.servlet.multipart.max-request-size=${MULTIPART_MAX_REQUEST_SIZE:10MB}

# ===== 국가·도시 기준 데이터 (API-LOC-1 / API-LOC-2) =====
# 저장소에 담긴 데이터셋 파일을 부팅 시 countries/cities 테이블로 적재한다(파일이 근거, DB는 파생물).
# 파일의 #version 이 마지막 적재 버전과 다를 때만 통째로 교체한다. 평시 부팅은 파일 헤더 한 줄과
# 상태 조회 두 번으로 끝나고, 전체 파싱은 실제 재적재가 필요할 때만 한다.
# 데이터셋 생성 방법은 docs/location-dataset.md 참고.
location.seed.enabled=${LOCATION_SEED_ENABLED:true}
location.seed.countries-path=data/locations/countries.tsv
location.seed.cities-path=data/locations/cities.tsv
location.seed.city-images-path=data/locations/city_images.tsv

# 서비스 언어 (API-USER-3/4). 명세가 "지원 언어 목록·기본값은 별도 확정"이라 설정으로 둔다. 2026-10-19 결정으로
# 한국어·영어 둘이다 — 사용자가 API-USER-4 로 저장할 수 있는 언어이자 AI 요청(API-AI-1/2)의 language 이고,
# 저장된 설정이 국가·도시 표시명 언어(API-LOC-1/2/3)의 1순위다(LocationLanguageResolver). AI 는 본문 language 와
# Accept-Language 로 출력 언어를 정한다(API-AI-1/2, DOM-4 §출력 언어, DOM-5: ko 외 언어는 제목·추천 이유·팁을
# 번역). 어떤 환경의 AI 가 특정 언어를 못 낸다면 LANGUAGE_SUPPORTED 로 좁힌다(빠진 코드는 저장 400, 표시명은
# Accept-Language 로만 결정).
# fallback 은 supported 안에 있어야 하며, users.language 의 DB 기본값('ko')과 같아야 한다.
language.supported=${LANGUAGE_SUPPORTED:ko,en}
language.fallback=${LANGUAGE_FALLBACK:ko}
# BE 가 응답 message 를 실제로 낼 수 있는 언어. 번역 리소스를 붙이기 전까지는 ko 하나다(Content-Language 가 이 중에서만 고른다).
language.message-languages=${LANGUAGE_MESSAGE_LANGUAGES:ko}
# 환율 (#100). AI 는 totalCost 를 목적지와 무관하게 원화로 주므로(source-currency), 코스 상세는 이를 목적지 현지 통화로
# 환산해 totalCostExRate 로 내리고 그 통화 기호를 exRateIcon 에 담는다.
# provider — currency-api: fawazahmed0/currency-api (키·출처 표시 불필요, 통화 340개, 매일 갱신). stub: 환율 없음(환산값 null).
# 설정이 없으면 stub 이다(다른 provider 스위치와 같이 네트워크를 타는 쪽은 명시해야 켜진다). 응답은 통화별로 캐시하고,
# 갱신 실패 시 두 번째 호스트 → 지난 값 순으로 버틴다.
exchange-rate.source-currency=${EXCHANGE_RATE_SOURCE_CURRENCY:KRW}
exchange-rate.provider=${EXCHANGE_RATE_PROVIDER:currency-api}
exchange-rate.base-url=${EXCHANGE_RATE_BASE_URL:https://cdn.jsdelivr.net/npm/@fawazahmed0/currency-api@latest/v1/currencies}
exchange-rate.fallback-url=${EXCHANGE_RATE_FALLBACK_URL:https://latest.currency-api.pages.dev/v1/currencies}
exchange-rate.cache-ttl=${EXCHANGE_RATE_CACHE_TTL:PT12H}
# 도시 사진 공개 주소. 사진은 프로필 이미지와 같은 버킷의 locations/ 프리픽스에 있으므로 기본값은
# 프로필 이미지 base-url 을 따른다. 비우면 추천 도시·코스 목록의 사진이 전부 빈 값으로 나간다.
location.images.base-url=${LOCATION_IMAGE_BASE_URL:${PROFILE_IMAGE_BASE_URL:}}

# ===== 친구 초대 공유 링크 (API-SHARE-1 / DOM-6) =====
# 링크 형태와 만료 정책은 명세가 정하지 않아 BE에서 정했다(docs/sprint-scope.md).
# base-url: 앱 딥링크/유니버설 링크의 기준 주소. 뒤에 /{shareToken} 이 붙는다(끝 슬래시 무시).
#           FE 가 서빙하는 초대 페이지 경로와 **정확히 일치해야 한다** — FE 라우트는
#           /invite/[shareToken] 이므로 /share 가 아니라 /invite 다. 경로가 어긋나면 발급된
#           링크가 전부 FE 404 로 떨어지며, 그 사실은 링크를 눌러 보기 전까지 드러나지 않는다.
share-link.base-url=${SHARE_LINK_BASE_URL:https://yeolo.vercel.app/invite}
# ttl: 링크 수명(ISO-8601 Duration). 0 이하면 무기한으로 발급해 expiresAt 이 null 로 나간다.
# 만료된 링크의 조회·수락은 410. 초대는 보통 며칠 안에 처리되므로 기본 7일로 두고,
# 유출된 링크가 영구히 코스를 여는 상황을 피한다.
share-link.ttl=${SHARE_LINK_TTL:P7D}

# ===== Google OAuth (API-FB-1) =====
google.oauth.client-id=${GOOGLE_CLIENT_ID:}
google.oauth.client-secret=${GOOGLE_CLIENT_SECRET:}
google.oauth.redirect-uri=${GOOGLE_REDIRECT_URI:}
google.oauth.token-uri=https://oauth2.googleapis.com/token
google.oauth.userinfo-uri=https://www.googleapis.com/oauth2/v3/userinfo

# ===== Apple Sign In (API-AUTH-2) =====
# client-id: Services ID(웹) 또는 App ID(네이티브). team-id/key-id/private-key(.p8)는 커밋 금지.
apple.oauth.client-id=${APPLE_CLIENT_ID:}
apple.oauth.team-id=${APPLE_TEAM_ID:}
apple.oauth.key-id=${APPLE_KEY_ID:}
# .p8 개인키 PEM 본문(개행 포함). 환경변수/로컬 설정으로만 주입.
apple.oauth.private-key=${APPLE_PRIVATE_KEY:}
apple.oauth.token-uri=https://appleid.apple.com/auth/token
apple.oauth.jwks-uri=https://appleid.apple.com/auth/keys
apple.oauth.issuer=https://appleid.apple.com

# ===== JWT =====
jwt.secret=${JWT_SECRET:}
# Access 1시간, Refresh 14일 (ms)
jwt.access-token-validity-ms=${JWT_ACCESS_TTL:3600000}
jwt.refresh-token-validity-ms=${JWT_REFRESH_TTL:1209600000}

# ===== AI 내부 API (API-BA-6) =====
# 내부 인증 키(X-Internal-Api-Key)는 커밋 금지 — 환경변수/로컬 설정으로 주입.
ai.internal.base-url=${AI_BASE_URL:http://localhost:8000}
ai.internal.api-key=${INTERNAL_API_KEY:}
# LLM 분석 실측 80초대. read 타임아웃은 "연속 무응답 허용 시간"이며, 아래 sse.stream-timeout-ms
# 보다 반드시 짧아야 AI가 멈췄을 때 스트림으로 error 이벤트를 내려보낼 수 있다.
ai.internal.connect-timeout-ms=${AI_CONNECT_TIMEOUT_MS:3000}
ai.internal.read-timeout-ms=${AI_READ_TIMEOUT_MS:240000}

# ===== SSE 스트림 (API-FB-2 / API-FB-4) =====
# 파이프라인은 구조적으로 길다: 전처리(이미지당 지오코딩, 정책상 ≥1초 간격) + AI 분석(80초대).
# 동시 요청은 공유 rate limiter에서 서로를 더 기다린다.
# 정상적으로 긴 요청을 자르지 않을 만큼 넉넉히 두되, 무한 점유는 막는다.
# 참고: keepalive는 프록시 idle만 막고 이 상한은 리셋하지 않는다(요청 시작 기준 절대 시간).
sse.stream-timeout-ms=${SSE_STREAM_TIMEOUT_MS:600000}

# ===== AI 코스 생성 (API-FB-4 / API-BA-1) =====
# provider: internal(기본) | stub. internal 선택 시 실제 /internal/ai/courses(SSE) 연동(TSK-7 #4).
# AI 서버 없이 로컬에서 흐름만 검증할 때 AI_COURSE_PROVIDER=stub 로 합성 응답으로 대체.
ai.course.provider=${AI_COURSE_PROVIDER:internal}

# ===== Reverse Geocode (DOM-5) =====
# provider: google(기본) | osm | stub. google 선택 시 API 키 필요(커밋 금지).
geocode.provider=${GEOCODE_PROVIDER:google}
geocode.google.api-key=${GOOGLE_MAPS_API_KEY:}
geocode.google.geocode-url=https://maps.googleapis.com/maps/api/geocode/json
# 좌표 주변 POI(장소명·유형) 보강 — 성향 분석 입력 품질을 올리는 선택 단계다.
# 이건 Geocoding이 아니라 Places API (New)라서 키에 그 API가 따로 열려 있어야 한다.
#   켜려면: 콘솔에서 'Places API (New)' 활성화 + 키의 API 제한 목록에 추가 후 아래 값을 넣는다.
#   GEOCODE_SEARCH_NEARBY_URL=https://places.googleapis.com/v1/places:searchNearby
# 비워두면 호출을 건너뛰고 Geocoding 결과(formatted_address·행정 타입)로 채운다 — 실패가 확정된
# 왕복을 사진마다 붙이지 않기 위해서다(그 지연이 SSE 응답에 그대로 들어간다).
# 구 API(maps.googleapis.com/maps/api/place/*)는 2025-03 이후 생성된 프로젝트에서 활성화 자체가
# 불가능하므로(REQUEST_DENIED "legacy API ... not enabled") 선택지가 아니다.
geocode.google.search-nearby-url=${GEOCODE_SEARCH_NEARBY_URL:}
geocode.google.nearby-radius=${GEOCODE_NEARBY_RADIUS:100}
geocode.google.language=ko
# osm: OpenStreetMap(Nominatim). API 키 불필요. 호스트 정책(user-agent·호출 간격)은 아래 nominatim.* 참고.
geocode.osm.reverse-url=https://nominatim.openstreetmap.org/reverse
geocode.osm.zoom=${GEOCODE_OSM_ZOOM:18}
geocode.osm.language=ko
# 같은 좌표 재조회를 줄이는 캐시 크기.
geocode.osm.cache-max-size=${GEOCODE_OSM_CACHE_MAX_SIZE:4096}

# ===== Nominatim 공개 서버 이용 정책 (역지오코딩·장소 조회 공통) =====
# user-agent는 이용 정책상 필수(앱/연락처 식별)이며, 연락처(이메일/전화)는 커밋하지 않는다 —
# GEOCODE_OSM_USER_AGENT 환경변수로 주입한다.
# 호출 간격(≤1req/s)은 기능이 아니라 호출자(IP) 단위 정책이라 역지오코딩과 장소 조회가 함께 지킨다.
# 자체 호스팅 서버를 쓰면 간격을 0으로 낮춘다.
nominatim.user-agent=${GEOCODE_OSM_USER_AGENT:Yeolo-BE/1.0}
nominatim.min-interval-ms=${NOMINATIM_MIN_INTERVAL_MS:1000}

# ===== 장소 조회 (API-PLACE-1 / DOM-3) =====
# 명세 개정(API-AI-2)으로 AI가 stop마다 장소 정보를 통째로 준다 — 정상 경로에서는 그걸 그대로
# 등록하므로(ItineraryPlaceNormalizer) 여기 provider는 호출되지 않는다.
# 즉 이 설정은 'AI가 식별자·좌표를 빠뜨렸을 때'만 타는 폴백 전용이다.
# provider: osm(기본) | google | stub. stub은 외부 호출 없이 장소명에서 합성한 결과를 쓴다.
# 기본이 osm인 이유: 폴백은 드물게 타는 경로라 키·과금 없이도 동작하는 편이 낫다. Places API (New)를
# 켰다면 google이 품질은 더 좋다(google 선택 시 API 키 필요, 커밋 금지).
# 사진은 URL에 키가 실려 노출 위험이 있어 내려보내지 않는다.
place.provider=${PLACE_PROVIDER:osm}
place.google.api-key=${GOOGLE_MAPS_API_KEY:}
# Places API (New). 신 API는 FieldMask로 운영시간까지 한 번에 주므로 별도 Details 호출이 없다.
place.google.search-text-url=https://places.googleapis.com/v1/places:searchText
place.google.language=ko
# osm: Nominatim /search. 키 불필요, 평점·사진 없음(null/빈 배열).
# user-agent·호출 간격은 위 nominatim.* 가 소유하며 역지오코딩과 리미터를 공유한다(NominatimConfig).
place.osm.search-url=https://nominatim.openstreetmap.org/search
place.osm.language=ko
