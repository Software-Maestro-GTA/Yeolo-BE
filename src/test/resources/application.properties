spring.application.name=yeolo

# ===== DataSource (H2 in-memory, PostgreSQL 호환 모드 — dev·prod과 정렬) =====
spring.datasource.url=jdbc:h2:mem:yeolo;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.open-in-view=false

# ===== 국가·도시 기준 데이터 (API-LOC-1 / API-LOC-2) =====
# 컨텍스트를 띄우는 테스트마다 수만 건을 H2에 적재할 이유가 없다. 적재 로직은 단위 테스트로,
# 조회 쿼리는 @DataJpaTest에서 자체 픽스처로 검증한다.
location.seed.enabled=false
location.seed.countries-path=data/locations/countries.tsv
location.seed.cities-path=data/locations/cities.tsv

# ===== Google OAuth (테스트 더미) =====
google.oauth.client-id=test-client-id
google.oauth.client-secret=test-client-secret
google.oauth.redirect-uri=http://localhost/callback
google.oauth.token-uri=https://oauth2.googleapis.com/token
google.oauth.userinfo-uri=https://www.googleapis.com/oauth2/v3/userinfo

# ===== AI 내부 API / SSE (테스트 더미) =====
# 타임아웃 체인은 운영과 같은 순서를 유지한다: ai read < sse stream.
ai.internal.base-url=http://localhost:8000
ai.internal.api-key=test-internal-key
ai.internal.connect-timeout-ms=3000
ai.internal.read-timeout-ms=240000
sse.stream-timeout-ms=600000

# ===== JWT (테스트 더미 시크릿, HS256용 32바이트 이상) =====
jwt.secret=test-secret-key-for-yeolo-jwt-hs256-please-change-0123456789
jwt.access-token-validity-ms=3600000
jwt.refresh-token-validity-ms=1209600000
