plugins {
    id 'java'
    id 'org.springframework.boot' version '4.1.0'
    id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.soma'
version = '0.0.1-SNAPSHOT'
description = 'yeolo'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(26)
    }
}

repositories {
    mavenCentral()
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-security-oauth2-client'
    implementation 'org.springframework.boot:spring-boot-starter-webmvc'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.boot:spring-boot-starter-actuator'  // k8s readiness/liveness probe
    implementation 'com.fasterxml.jackson.core:jackson-databind'
    // 프로필 이미지 저장(API-USER-1). 동기 S3Client만 쓰므로 기본 HTTP 클라이언트(Apache)와
    // 비동기용 Netty 를 빼고 경량 url-connection-client 로 대체한다(이미지 크기·기동 시간).
    implementation platform('software.amazon.awssdk:bom:2.46.7')
    implementation('software.amazon.awssdk:s3') {
        exclude group: 'software.amazon.awssdk', module: 'apache-client'
        exclude group: 'software.amazon.awssdk', module: 'netty-nio-client'
    }
    implementation 'software.amazon.awssdk:url-connection-client'
    // IRSA 필수. s3 는 sts 를 끌어오지 않는데, sts 가 클래스패스에 없으면 SDK 기본
    // 자격증명 체인이 WebIdentityTokenFileCredentialsProvider 를 조용히 건너뛰고
    // IMDS(노드 인스턴스 역할)로 폴백한다 — AWS_ROLE_ARN·토큰 파일이 파드에 멀쩡히
    // 주입돼 있어도 그렇다. 그러면 S3 호출이 전부 AccessDenied 인데 에러 주체가
    // assumed-role/default-eks-node-group-... 으로 찍혀 원인을 IAM 에서 찾게 된다
    // (2026-08-10 dev 회원탈퇴 500 의 실제 원인). 빼지 말 것.
    runtimeOnly('software.amazon.awssdk:sts') {
        exclude group: 'software.amazon.awssdk', module: 'apache-client'
        exclude group: 'software.amazon.awssdk', module: 'netty-nio-client'
    }
    implementation 'io.jsonwebtoken:jjwt-api:0.12.6'
    runtimeOnly 'io.jsonwebtoken:jjwt-impl:0.12.6'
    runtimeOnly 'io.jsonwebtoken:jjwt-jackson:0.12.6'
    compileOnly 'org.projectlombok:lombok'
    runtimeOnly 'org.postgresql:postgresql'        // local·dev·prod: PostgreSQL
    annotationProcessor 'org.projectlombok:lombok'
    testImplementation 'org.springframework.boot:spring-boot-starter-data-jpa-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-security-oauth2-client-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
    testRuntimeOnly 'com.h2database:h2'
    testCompileOnly 'org.projectlombok:lombok'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    testAnnotationProcessor 'org.projectlombok:lombok'
}

tasks.named('test') {
    useJUnitPlatform()
}
