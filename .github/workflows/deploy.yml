name: deploy

# main 브랜치 push 만 배포한다.
# OIDC trust 가 ref:refs/heads/main 으로 고정돼 있어 다른 ref 에서는 role assume 자체가 불가.
# (확장하려면 인프라 repo github-oidc.tf:51-55 의 sub 조건을 먼저 넓혀야 함)
on:
  push:

    branches: [main]
  workflow_dispatch: {}

# 최소 권한: OIDC 토큰 발급 + 소스 read 만.
permissions:
  contents: read
  id-token: write

env:
  AWS_REGION: ${{ vars.AWS_REGION }}
  ECR_REPOSITORY: ${{ vars.ECR_REPOSITORY }}
  EKS_CLUSTER: ${{ vars.EKS_CLUSTER }}
  K8S_NAMESPACE: ${{ vars.K8S_NAMESPACE }}
  DEPLOYMENT_NAME: ${{ vars.DEPLOYMENT_NAME }}
  # 이미지 태그 = immutable git commit SHA. mutable 태그로 배포 금지.
  IMAGE_TAG: ${{ github.sha }}

jobs:
  build-and-push:
    # workflow_dispatch 로 실행하더라도 main 에서만 동작(OIDC trust 와 일치).
    if: github.ref == 'refs/heads/main'
    # EKS 노드가 Graviton(arm64, t4g)이므로 arm64 네이티브 러너에서 빌드한다.
    # amd64 러너로 빌드하면 노드에서 'exec format error' 로 CrashLoopBackOff.
    # (호스트가 arm64라 build-push-action 의 platforms 지정 없이 arm64 이미지가 나온다.)
    runs-on: ubuntu-24.04-arm
    outputs:
      image: ${{ steps.meta.outputs.image }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Resolve image reference
        id: meta
        run: echo "image=${ECR_REPOSITORY}:${IMAGE_TAG}" >> "$GITHUB_OUTPUT"

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.image }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: false

  deploy:
    needs: build-and-push
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    # 승인 게이트를 걸 수 있도록 environment 지정.
    environment: dev
    # 같은 앱의 배포를 직렬화한다. 진행 중 배포는 취소하지 않고 대기.
    concurrency:
      group: deploy-${{ github.repository }}-${{ github.ref }}
      cancel-in-progress: false
    env:
      IMAGE: ${{ needs.build-and-push.outputs.image }}
      # container name 미지정 시 deployment name 을 사용.
      CONTAINER_NAME: ${{ vars.CONTAINER_NAME || vars.DEPLOYMENT_NAME }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Update kubeconfig
        run: aws eks update-kubeconfig --region "$AWS_REGION" --name "$EKS_CLUSTER"

      # 앱 env/비밀은 Yeolo-BE 가 소유한다. GitHub Secrets/Variables 값을 was-secrets
      # Secret 으로 만들어 클러스터에 주입한다(인프라 미관여). Deployment 가
      # envFrom(secretRef: was-secrets)으로 로드한다. 비밀은 Environment(dev) secrets 에,
      # 비밀 아닌 값은 repo Variables 에 둔다. 값이 빈 키는 env-file 에서 제외한다.
      - name: Sync app secrets (was-secrets)
        env:
          # ── 비밀: GitHub → Settings → Environments(dev) → secrets ──
          DB_URL: ${{ secrets.DB_URL }}
          DB_USERNAME: ${{ secrets.DB_USERNAME }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          GOOGLE_REDIRECT_URI: ${{ secrets.GOOGLE_REDIRECT_URI }}
          AI_INTERNAL_API_KEY: ${{ secrets.AI_INTERNAL_API_KEY }}
          # ── 비밀 아님: repo Variables (없으면 기본값) ──
          JPA_DDL_AUTO: ${{ vars.JPA_DDL_AUTO || 'validate' }}
          AI_BASE_URL: ${{ vars.AI_BASE_URL || 'http://ai.app.svc.cluster.local:8000' }}
          AI_COURSE_PROVIDER: ${{ vars.AI_COURSE_PROVIDER || 'internal' }}
          GEOCODE_PROVIDER: ${{ vars.GEOCODE_PROVIDER || 'osm' }}
          GEOCODE_OSM_USER_AGENT: ${{ vars.GEOCODE_OSM_USER_AGENT }}
          JWT_ACCESS_TTL: ${{ vars.JWT_ACCESS_TTL || '3600000' }}
          JWT_REFRESH_TTL: ${{ vars.JWT_REFRESH_TTL || '1209600000' }}
        run: |
          umask 077
          : > was.env
          for k in DB_URL DB_USERNAME DB_PASSWORD JWT_SECRET JWT_ACCESS_TTL JWT_REFRESH_TTL \
                   GOOGLE_CLIENT_ID GOOGLE_CLIENT_SECRET GOOGLE_REDIRECT_URI \
                   AI_BASE_URL AI_INTERNAL_API_KEY AI_COURSE_PROVIDER \
                   JPA_DDL_AUTO GEOCODE_PROVIDER GEOCODE_OSM_USER_AGENT; do
            v="${!k}"
            [ -n "$v" ] && printf '%s=%s\n' "$k" "$v" >> was.env
          done
          kubectl -n "$K8S_NAMESPACE" create secret generic was-secrets \
            --from-env-file=was.env --dry-run=client -o yaml | kubectl apply -f -
          rm -f was.env

      # CD 는 이미지 태그만 교체한다. apply -k / 전체 매니페스트 재apply 금지(:bootstrap 회귀).
      - name: Set image
        run: |
          kubectl -n "$K8S_NAMESPACE" set image \
            "deployment/${DEPLOYMENT_NAME}" \
            "${CONTAINER_NAME}=${IMAGE}"

      # 무중단(rolling) rollout 검증.
      - name: Verify rollout
        run: kubectl -n "$K8S_NAMESPACE" rollout status "deployment/${DEPLOYMENT_NAME}" --timeout=5m

      # 실패 시 직전 리비전으로 자동 롤백.
      - name: Rollback on failure
        if: failure()
        run: |
          echo "rollout failed — rolling back deployment/${DEPLOYMENT_NAME}"
          kubectl -n "$K8S_NAMESPACE" rollout undo "deployment/${DEPLOYMENT_NAME}"
          kubectl -n "$K8S_NAMESPACE" rollout status "deployment/${DEPLOYMENT_NAME}" --timeout=5m
