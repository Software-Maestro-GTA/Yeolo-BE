name: deploy

# main → prod(app ns), dev → dev(app-dev ns) 두 갈래 배포.
# 브랜치별로 OIDC role 이 다르고, trust 조건(인프라 repo github-oidc.tf:95-102)이
# 서로를 거부한다. 각 role 이 받는 sub 는 두 형태뿐이다:
#   prod role(…-gha-be)     : ref:refs/heads/main / environment:prod
#   dev  role(…-gha-be-dev) : ref:refs/heads/dev  / environment:dev
# 겹치지 않으므로 dev 브랜치에서 prod 네임스페이스를 건드릴 수 없다(의도된 격리).
#
# ★ Environment 이름은 OIDC sub 에 그대로 박힌다. 바꾸려면 인프라
#   (var.github_deploy_environment / var.github_dev_environment) 와 락스텝이어야 하고,
#   한쪽만 바꾸면 그 환경의 배포가 AssumeRole 단계에서 즉시 끊긴다.
#   (과거 이름: prod=dev, dev=dev-app — 헷갈려서 2026-08 에 정리했다.)
on:
  push:
    branches: [main, dev]
  workflow_dispatch: {}

# 최소 권한: OIDC 토큰 발급 + 소스 read 만.
permissions:
  contents: read
  id-token: write

env:
  AWS_REGION: ${{ vars.AWS_REGION }}
  ECR_REPOSITORY: ${{ vars.ECR_REPOSITORY }}
  EKS_CLUSTER: ${{ vars.EKS_CLUSTER }}
  K8S_NAMESPACE: ${{ vars.K8S_NAMESPACE }}
  DEPLOYMENT_NAME: ${{ vars.DEPLOYMENT_NAME }}
  # 이미지 태그 = immutable git commit SHA. mutable 태그로 배포 금지.
  IMAGE_TAG: ${{ github.sha }}

jobs:
  # 빌드는 두 브랜치가 공유한다. environment 를 붙이지 않으므로 sub 는 ref 형태로
  # 나가고, 브랜치에 맞는 role 만 골라 쓰면 된다. ECR 리포는 prod·dev 공용이고
  # 이미지 태그가 git SHA 라 섞이지 않는다.
  build-and-push:
    # workflow_dispatch 로 실행하더라도 main/dev 에서만 동작(OIDC trust 와 일치).
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/dev'
    # EKS 노드가 Graviton(arm64, t4g)이므로 arm64 네이티브 러너에서 빌드한다.
    # amd64 러너로 빌드하면 노드에서 'exec format error' 로 CrashLoopBackOff.
    # (호스트가 arm64라 build-push-action 의 platforms 지정 없이 arm64 이미지가 나온다.)
    # dev 노드도 같은 Graviton 이라 브랜치와 무관하게 arm64 로 빌드한다.
    runs-on: ubuntu-24.04-arm
    outputs:
      image: ${{ steps.meta.outputs.image }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # 브랜치별로 assume 할 role 을 고른다. 값이 비어 있으면 여기서 즉시 실패시킨다.
      # (표현식 fallback 으로 흘려보내면 dev 가 prod role 을 시도해 AssumeRole 거부
      #  메시지만 남고, 원인이 'AWS_ROLE_ARN_DEV 미설정'이라는 게 드러나지 않는다.)
      - name: Resolve OIDC role
        id: role
        env:
          ROLE_PROD: ${{ vars.AWS_ROLE_ARN }}
          ROLE_DEV: ${{ vars.AWS_ROLE_ARN_DEV }}
        run: |
          if [ "$GITHUB_REF" = "refs/heads/dev" ]; then
            role="$ROLE_DEV"; hint="AWS_ROLE_ARN_DEV"
          else
            role="$ROLE_PROD"; hint="AWS_ROLE_ARN"
          fi
          if [ -z "$role" ]; then
            echo "::error::${hint} 변수가 비어 있습니다. GitHub → Settings → Variables 에 설정하세요."
            exit 1
          fi
          echo "arn=$role" >> "$GITHUB_OUTPUT"

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ steps.role.outputs.arn }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Resolve image reference
        id: meta
        run: echo "image=${ECR_REPOSITORY}:${IMAGE_TAG}" >> "$GITHUB_OUTPUT"

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.image }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: false

  # ── prod 배포 (main 브랜치 전용) ──────────────────────────────────────────
  deploy:
    needs: build-and-push
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    # environment 는 승인 게이트용이 아니라(게이트 없음) OIDC sub 와 시크릿 스코프용이다.
    # 이 job 의 토큰 sub 는 environment:prod 로 발급되고 prod role 이 그것만 받는다.
    environment: prod
    # 같은 앱의 배포를 직렬화한다. 진행 중 배포는 취소하지 않고 대기.
    concurrency:
      group: deploy-${{ github.repository }}-${{ github.ref }}
      cancel-in-progress: false
    env:
      IMAGE: ${{ needs.build-and-push.outputs.image }}
      # container name 미지정 시 deployment name 을 사용.
      CONTAINER_NAME: ${{ vars.CONTAINER_NAME || vars.DEPLOYMENT_NAME }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Update kubeconfig
        run: aws eks update-kubeconfig --region "$AWS_REGION" --name "$EKS_CLUSTER"

      # 앱 env/비밀은 Yeolo-BE 가 소유한다(DB 계정만 예외 — 아래 ★). GitHub
      # Secrets/Variables 값을 was-secrets Secret 으로 만들어 클러스터에 주입하고,
      # Deployment 가 envFrom(secretRef: was-secrets)으로 로드한다. 비밀은
      # Environment(prod) secrets 에, 비밀 아닌 값 중 환경별로 달라야 하는 것은
      # Environment variables 에 둔다(repo 레벨은 prod·dev 공통값만 — 상속 누수 주의).
      # 값이 빈 키는 env-file 에서 제외한다.
      - name: Sync app secrets (was-secrets)
        env:
          # ── 비밀: GitHub → Settings → Environments(prod) → secrets ──
          #
          # ★ DB_USERNAME/DB_PASSWORD 는 넣지 않는다. DB 계정은 인프라가
          #   Secrets Manager → External Secrets → db-credentials Secret 으로 주입하며
          #   로테이션도 그쪽에서 반영된다. 같은 키를 was-secrets 에 또 넣으면 envFrom
          #   순서상 GitHub 의 낡은 값이 최신 값을 덮어, 비밀번호 로테이션 후 새 파드가
          #   인증 실패로 기동하지 않는다(2026-08-06 prod CrashLoopBackOff 인시던트).
          #   DB_URL(host/port/db)만 우리가 넣는다.
          DB_URL: ${{ secrets.DB_URL }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          GOOGLE_REDIRECT_URI: ${{ secrets.GOOGLE_REDIRECT_URI }}
          GOOGLE_MAPS_API_KEY: ${{ secrets.GOOGLE_MAPS_API_KEY }}
          INTERNAL_API_KEY: ${{ secrets.INTERNAL_API_KEY }}
          APPLE_CLIENT_ID: ${{ secrets.APPLE_CLIENT_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_KEY_ID: ${{ secrets.APPLE_KEY_ID }}
          # .p8 개인키는 개행 없는 한 줄(BEGIN/END 헤더 제외 base64 본문)로 저장한다.
          # --from-env-file 은 여러 줄 값을 파싱하지 못한다.
          APPLE_PRIVATE_KEY: ${{ secrets.APPLE_PRIVATE_KEY }}
          # ── 비밀 아님: variables (environment > repository > organization) ──
          # 여기서 기본값(|| '...')을 주지 않는다. 워크플로가 값을 지어내면 GitHub 설정이
          # 틀려도 그럴듯하게 배포되고, 설정 오류가 앱 동작 이상으로만 뒤늦게 드러난다.
          # 값이 비면 그 키는 was.env 에서 빠지고 앱이 application.properties 의 기본값을
          # 쓴다 — 기본값의 단일 출처는 앱이다. 단, 앱 기본값이 로컬 개발 기준이라
          # 클러스터에서 그대로 쓰면 안 되는 키는 아래 required-vars 가드로 막는다.
          JPA_DDL_AUTO: ${{ vars.JPA_DDL_AUTO }}
          AI_BASE_URL: ${{ vars.AI_BASE_URL }}
          AI_COURSE_PROVIDER: ${{ vars.AI_COURSE_PROVIDER }}
          GEOCODE_PROVIDER: ${{ vars.GEOCODE_PROVIDER }}
          GEOCODE_OSM_USER_AGENT: ${{ vars.GEOCODE_OSM_USER_AGENT }}
          # 좌표 주변 POI 보강(Places API (New) Nearby Search) 엔드포인트.
          # 비워두면 앱이 호출을 건너뛰고 Geocoding 결과로 채운다 — 즉 '미설정=기능 꺼짐'이
          # 정상이라 아래 required-vars 가드 대상이 아니다. 켜려면 Google 콘솔에서
          # 'Places API (New)' 활성화 + GOOGLE_MAPS_API_KEY 의 API 제한 목록에 추가한 뒤
          # variables 에 https://places.googleapis.com/v1/places:searchNearby 를 넣는다.
          # (키에 그 API 가 안 열려 있으면 사진 한 장마다 403 왕복이 붙어 SSE 가 느려진다.)
          GEOCODE_SEARCH_NEARBY_URL: ${{ vars.GEOCODE_SEARCH_NEARBY_URL }}
          PLACE_PROVIDER: ${{ vars.PLACE_PROVIDER }}
          PROFILE_IMAGE_PROVIDER: ${{ vars.PROFILE_IMAGE_PROVIDER }}
          PROFILE_IMAGE_S3_BUCKET: ${{ vars.PROFILE_IMAGE_S3_BUCKET }}
          PROFILE_IMAGE_S3_REGION: ${{ vars.PROFILE_IMAGE_S3_REGION }}
          PROFILE_IMAGE_BASE_URL: ${{ vars.PROFILE_IMAGE_BASE_URL }}
          # 공유 링크의 기준 주소(API-SHARE-1). FE 초대 페이지 경로와 **정확히 일치**해야 한다 —
          # 현재 FE 라우트가 /invite/[shareToken] 이므로 값은 .../invite 로 끝난다. 어긋나면
          # 발급된 링크가 전부 FE 404 로 떨어지는데, BE 응답은 200 이라 눌러 보기 전엔 모른다.
          # 비우면 앱 기본값(https://yeolo.vercel.app/invite)을 쓰므로 required 가드 대상은 아니다.
          # 커스텀 도메인으로 옮길 때 이 변수만 바꾸면 된다.
          # ★ dev·prod 가 같은 FE 한 곳을 가리킨다. FE 는 한 번에 한 BE 만 보므로, FE 가 보지
          #   않는 쪽 BE 가 발급한 링크는 토큰이 그 DB 에만 있어 상대편에서 404 가 된다. 값이
          #   같아도 정상인 이유이며, dev 에서 끝까지 확인하려면 FE 의 API base 를 dev 로 돌려야
          #   한다. FE 프리뷰 배포가 따로 생기면 그때 환경별로 값을 갈라 준다.
          #   (docs/share-link-deeplink-plan.md §7)
          SHARE_LINK_BASE_URL: ${{ vars.SHARE_LINK_BASE_URL }}
          # 링크 수명(ISO-8601 Duration). 비우면 앱 기본값 P7D. 0 이하면 무기한(expiresAt: null).
          SHARE_LINK_TTL: ${{ vars.SHARE_LINK_TTL }}
          JWT_ACCESS_TTL: ${{ vars.JWT_ACCESS_TTL }}
          JWT_REFRESH_TTL: ${{ vars.JWT_REFRESH_TTL }}
        run: |
          umask 077
          : > was.env
          for k in DB_URL JWT_SECRET JWT_ACCESS_TTL JWT_REFRESH_TTL \
                   GOOGLE_CLIENT_ID GOOGLE_CLIENT_SECRET GOOGLE_REDIRECT_URI \
                   GOOGLE_MAPS_API_KEY \
                   APPLE_CLIENT_ID APPLE_TEAM_ID APPLE_KEY_ID APPLE_PRIVATE_KEY \
                   AI_BASE_URL INTERNAL_API_KEY AI_COURSE_PROVIDER \
                   JPA_DDL_AUTO GEOCODE_PROVIDER GEOCODE_OSM_USER_AGENT \
                   GEOCODE_SEARCH_NEARBY_URL PLACE_PROVIDER \
                   PROFILE_IMAGE_PROVIDER PROFILE_IMAGE_S3_BUCKET PROFILE_IMAGE_S3_REGION \
                   PROFILE_IMAGE_BASE_URL SHARE_LINK_BASE_URL SHARE_LINK_TTL; do
            v="${!k}"
            [ -n "$v" ] && printf '%s=%s\n' "$k" "$v" >> was.env
          done
          # 필수 키가 비어 있으면(예: prod Environment secrets 미설정) 여기서 즉시 중단한다.
          # 이 가드가 없으면 was-secrets 가 필수 설정 없이 만들어져 새 파드가 기동에
          # 실패하고, 그 사실이 'Verify rollout' 5분 타임아웃→롤백으로만 드러난다(#27 인시던트).
          # DB_USERNAME/DB_PASSWORD 는 db-credentials 가 채우므로 검사 대상이 아니다.
          # GOOGLE_MAPS_API_KEY 는 GEOCODE_PROVIDER=google 일 때만 필수다. 값이 비면 역지오코딩이
          # Google 에 키 없이 요청해 REQUEST_DENIED 를 받고, 취향 분석·코스 생성이 전처리 단계에서
          # 전부 죽는다. 그런데 시크릿은 **이름만 있고 값이 비어도** GitHub 화면에서는 정상으로 보이고,
          # 이 워크플로는 빈 값을 was.env 에서 제외하므로 배포는 초록불로 끝난다 — 즉 배포도 파드도
          # 정상인데 기능만 죽는다(2026-08-27 prod 인시던트). 그래서 여기서 끊는다.
          missing=""
          required_secrets="DB_URL JWT_SECRET INTERNAL_API_KEY"
          # 한 키를 두 곳이 쓴다 — geocode.google.api-key 와 place.google.api-key 가 모두
          # ${GOOGLE_MAPS_API_KEY} 다. 그래서 둘 중 하나라도 google 이면 필수다.
          # PLACE_PROVIDER 쪽이 오히려 더 나쁘다: GooglePlaceLookupClient 는 조회 실패를
          # 예외가 아니라 빈 값으로 돌려주므로(포트 계약), 키가 없으면 403 을 삼킨 채 장소가
          # 가짜 좌표로 **DB 에 저장**되고 provider 를 고쳐도 복구되지 않는다.
          # if 문으로 감싼다. `grep && x=y` 로 쓰면 provider 가 google 이 아닐 때 AND 리스트가
          # 비0으로 끝나고, GitHub Actions 의 기본 셸이 `bash -e` 라 그 자리에서 스텝이 죽는다.
          if grep -q '^GEOCODE_PROVIDER=google$' was.env || grep -q '^PLACE_PROVIDER=google$' was.env; then
            required_secrets="$required_secrets GOOGLE_MAPS_API_KEY"
          fi
          for req in $required_secrets; do
            grep -q "^${req}=" was.env || missing="$missing $req"
          done
          if [ -n "$missing" ]; then
            echo "::error::필수 시크릿 누락 →$missing. GitHub → Settings → Environments(prod) → Secrets 에 설정 후 재실행하세요. (이름만 있고 값이 비어 있어도 누락으로 잡힙니다)"
            rm -f was.env
            exit 1
          fi
          # 아래 variables 는 앱 기본값이 로컬 개발용이라 미설정 시 조용히 잘못 뜬다.
          #   JPA_DDL_AUTO   앱 기본 update  → 운영 스키마 자동 변경(규약: prod=validate)
          #   AI_BASE_URL    앱 기본 localhost:8000 → AI 호출 전부 실패
          #   GEOCODE_PROVIDER 앱 기본 stub → 지오코딩이 가짜 좌표/주소 반환
          #   PROFILE_IMAGE_* 앱 기본 provider=stub → 프로필 이미지가 열리지 않는 합성 URL 로
          #                    '저장'되고, 사용자가 다시 올리기 전까지 복구되지 않는다.
          #                    s3 로 쓰려면 버킷·공개 base URL 이 함께 있어야 한다.
          #   PLACE_PROVIDER   앱 기본 stub → 코스 장소가 가짜 좌표로 '저장'된다(지오코딩과
          #                    달리 DB에 남고 재조회하지 않아 provider를 바꿔도 복구되지 않는다)
          # 워크플로가 기본값을 지어내는 대신, 없으면 배포를 끊는다.
          missing_vars=""
          for req in JPA_DDL_AUTO AI_BASE_URL GEOCODE_PROVIDER PLACE_PROVIDER \
                     PROFILE_IMAGE_PROVIDER PROFILE_IMAGE_S3_BUCKET PROFILE_IMAGE_BASE_URL; do
            grep -q "^${req}=" was.env || missing_vars="$missing_vars $req"
          done
          if [ -n "$missing_vars" ]; then
            echo "::error::필수 변수 누락 →$missing_vars. GitHub → Settings → Environments(prod) → Variables (또는 repo Variables) 에 설정 후 재실행하세요."
            rm -f was.env
            exit 1
          fi
          kubectl -n "$K8S_NAMESPACE" create secret generic was-secrets \
            --from-env-file=was.env --dry-run=client -o yaml | kubectl apply -f -
          rm -f was.env

      # CD 는 이미지 태그만 교체한다. apply -k / 전체 매니페스트 재apply 금지(:bootstrap 회귀).
      - name: Set image
        id: set_image
        run: |
          before="$(kubectl -n "$K8S_NAMESPACE" get deployment "$DEPLOYMENT_NAME" \
            -o jsonpath="{.spec.template.spec.containers[?(@.name=='${CONTAINER_NAME}')].image}")"
          kubectl -n "$K8S_NAMESPACE" set image \
            "deployment/${DEPLOYMENT_NAME}" \
            "${CONTAINER_NAME}=${IMAGE}"
          # 같은 커밋을 다시 배포하면(workflow_dispatch 재실행, 시크릿만 고친 경우) set image 가
          # no-op 이라 롤아웃이 일어나지 않는다. 그러면 방금 만든 was-secrets 가 돌고 있는 파드에
          # 반영되지 않은 채 'Verify rollout' 이 즉시 성공한다 — 워크플로도 파드도 초록불인데
          # 설정만 옛 값인 상태다(2026-08-27 GOOGLE_MAPS_API_KEY 인시던트: 값을 채우고 재배포했는데
          # 증상이 그대로였다). Reloader 는 db-credentials 만 보므로 여기서 처리한다.
          # 이미지가 바뀐 경우에는 그 롤아웃이 이미 새 시크릿을 물고 뜨므로 재시작하지 않는다
          # (하면 롤아웃이 두 번 돈다).
          # ⚠️ 이 경로에서 파드가 죽으면 아래 'Rollback on failure' 는 구제하지 못한다. was-secrets
          #    는 이미 클러스터에서 덮어써졌고 rollout undo 는 파드 템플릿만 되돌리므로, 되살아난
          #    파드도 같은(잘못된) 시크릿을 물고 똑같이 죽는다. 설정이 원인일 때는 undo 가 아니라
          #    값을 고쳐 다시 배포해야 한다.
          if [ "$before" = "$IMAGE" ]; then
            echo "이미지 동일($IMAGE) — was-secrets 반영을 위해 rollout restart 한다."
            kubectl -n "$K8S_NAMESPACE" rollout restart "deployment/${DEPLOYMENT_NAME}"
          fi

      # 무중단(rolling) rollout 검증.
      - name: Verify rollout
        run: kubectl -n "$K8S_NAMESPACE" rollout status "deployment/${DEPLOYMENT_NAME}" --timeout=5m

      # 이번 배포가 실제로 이미지를 바꾼 뒤 실패했을 때만 직전 리비전으로 되돌린다.
      # 그냥 failure() 로 두면 시크릿 sync·kubeconfig 실패처럼 클러스터를 건드리지도
      # 않은 단계에서도 rollout undo 가 돌아, 멀쩡히 서비스 중이던 리비전을 한 칸
      # 뒤로 밀어버린다(설정 오타가 정상 배포를 되돌리는 사고).
      - name: Rollback on failure
        if: failure() && steps.set_image.outcome == 'success'
        run: |
          echo "rollout failed — rolling back deployment/${DEPLOYMENT_NAME}"
          kubectl -n "$K8S_NAMESPACE" rollout undo "deployment/${DEPLOYMENT_NAME}"
          kubectl -n "$K8S_NAMESPACE" rollout status "deployment/${DEPLOYMENT_NAME}" --timeout=5m

  # ── dev 배포 (dev 브랜치 전용) ────────────────────────────────────────────
  # prod job 과 구조는 같고 대상 네임스페이스/role 만 다르다.
  # 클러스터는 prod 와 같은 하나(yeolo-dev)를 쓰고 네임스페이스로만 분리한다
  # (인프라 variables.tf: "dev 환경 — prod 와 같은 클러스터·같은 노드, 네임스페이스만 분리").
  # 그래서 EKS_CLUSTER 는 vars 를 그대로 쓰고, 실제 경계인 네임스페이스만 리터럴로 박는다.
  deploy-dev:
    needs: build-and-push
    if: github.ref == 'refs/heads/dev'
    runs-on: ubuntu-latest
    # OIDC sub 조건(environment:dev)과 정확히 일치해야 role assume 이 통과한다.
    environment: dev
    concurrency:
      group: deploy-dev-${{ github.repository }}
      cancel-in-progress: false
    env:
      K8S_NAMESPACE: app-dev
      IMAGE: ${{ needs.build-and-push.outputs.image }}
      CONTAINER_NAME: ${{ vars.CONTAINER_NAME || vars.DEPLOYMENT_NAME }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN_DEV }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Update kubeconfig
        run: aws eks update-kubeconfig --region "$AWS_REGION" --name "$EKS_CLUSTER"

      # prod 와 동일하게 앱 env/비밀은 BE 가 소유한다. 값은 Environment(dev) 의
      # secrets/variables 에서 온다 — prod 와 다른 값을 쓸 것(외부 키, redirect URI 등).
      #
      # ★ DB_USERNAME/DB_PASSWORD 는 넣지 않는다. dev DB 계정은 인프라가
      #   Secrets Manager → External Secrets → db-credentials Secret 으로 주입한다.
      #   같은 키를 was-secrets 에 또 넣으면 envFrom 순서에 따라 한쪽이 덮여
      #   인증 실패로 파드가 기동하지 않는다.
      #   DB_URL(host/port/db)만 우리가 넣는다 — 값은 인프라 repo 의
      #   `terraform output -json app_env_reference_dev` 참고.
      - name: Sync app secrets (was-secrets)
        env:
          # ── 비밀: Settings → Environments(dev) → secrets ──
          DB_URL: ${{ secrets.DB_URL }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          GOOGLE_REDIRECT_URI: ${{ secrets.GOOGLE_REDIRECT_URI }}
          GOOGLE_MAPS_API_KEY: ${{ secrets.GOOGLE_MAPS_API_KEY }}
          INTERNAL_API_KEY: ${{ secrets.INTERNAL_API_KEY }}
          APPLE_CLIENT_ID: ${{ secrets.APPLE_CLIENT_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_KEY_ID: ${{ secrets.APPLE_KEY_ID }}
          # .p8 개인키는 개행 없는 한 줄(BEGIN/END 헤더 제외 base64 본문)로 저장한다.
          # --from-env-file 은 여러 줄 값을 파싱하지 못한다.
          APPLE_PRIVATE_KEY: ${{ secrets.APPLE_PRIVATE_KEY }}
          # ── 비밀 아님: variables (environment > repository > organization) ──
          # 여기서 기본값(|| '...')을 주지 않는다. 워크플로가 값을 지어내면 GitHub 설정이
          # 틀려도 그럴듯하게 배포되고, 설정 오류가 앱 동작 이상으로만 뒤늦게 드러난다.
          # 값이 비면 그 키는 was.env 에서 빠지고 앱이 application.properties 의 기본값을
          # 쓴다 — 기본값의 단일 출처는 앱이다. 단, 앱 기본값이 로컬 개발 기준이라
          # 클러스터에서 그대로 쓰면 안 되는 키는 아래 required-vars 가드로 막는다.
          #
          # ★ AI_BASE_URL 은 dev Environment 에 반드시 있어야 한다. repo 레벨 값이
          #   prod AI(ai.app)를 가리키므로, dev 에 없으면 dev WAS 가 prod AI 를 호출한다.
          #   (가드는 "값이 있는지"만 보므로 repo 레벨 값을 상속해도 통과한다 — dev 전용
          #    값이 실제로 들어 있는지는 Environment(dev) Variables 에서 직접 확인할 것.)
          JPA_DDL_AUTO: ${{ vars.JPA_DDL_AUTO }}
          AI_BASE_URL: ${{ vars.AI_BASE_URL }}
          AI_COURSE_PROVIDER: ${{ vars.AI_COURSE_PROVIDER }}
          GEOCODE_PROVIDER: ${{ vars.GEOCODE_PROVIDER }}
          GEOCODE_OSM_USER_AGENT: ${{ vars.GEOCODE_OSM_USER_AGENT }}
          # 좌표 주변 POI 보강(Places API (New) Nearby Search) 엔드포인트.
          # 비워두면 앱이 호출을 건너뛰고 Geocoding 결과로 채운다 — 즉 '미설정=기능 꺼짐'이
          # 정상이라 아래 required-vars 가드 대상이 아니다. 켜려면 Google 콘솔에서
          # 'Places API (New)' 활성화 + GOOGLE_MAPS_API_KEY 의 API 제한 목록에 추가한 뒤
          # variables 에 https://places.googleapis.com/v1/places:searchNearby 를 넣는다.
          # (키에 그 API 가 안 열려 있으면 사진 한 장마다 403 왕복이 붙어 SSE 가 느려진다.)
          GEOCODE_SEARCH_NEARBY_URL: ${{ vars.GEOCODE_SEARCH_NEARBY_URL }}
          PLACE_PROVIDER: ${{ vars.PLACE_PROVIDER }}
          PROFILE_IMAGE_PROVIDER: ${{ vars.PROFILE_IMAGE_PROVIDER }}
          PROFILE_IMAGE_S3_BUCKET: ${{ vars.PROFILE_IMAGE_S3_BUCKET }}
          PROFILE_IMAGE_S3_REGION: ${{ vars.PROFILE_IMAGE_S3_REGION }}
          PROFILE_IMAGE_BASE_URL: ${{ vars.PROFILE_IMAGE_BASE_URL }}
          # 공유 링크의 기준 주소(API-SHARE-1). FE 초대 페이지 경로와 **정확히 일치**해야 한다 —
          # 현재 FE 라우트가 /invite/[shareToken] 이므로 값은 .../invite 로 끝난다. 어긋나면
          # 발급된 링크가 전부 FE 404 로 떨어지는데, BE 응답은 200 이라 눌러 보기 전엔 모른다.
          # 비우면 앱 기본값(https://yeolo.vercel.app/invite)을 쓰므로 required 가드 대상은 아니다.
          # 커스텀 도메인으로 옮길 때 이 변수만 바꾸면 된다.
          # ★ dev·prod 가 같은 FE 한 곳을 가리킨다. FE 는 한 번에 한 BE 만 보므로, FE 가 보지
          #   않는 쪽 BE 가 발급한 링크는 토큰이 그 DB 에만 있어 상대편에서 404 가 된다. 값이
          #   같아도 정상인 이유이며, dev 에서 끝까지 확인하려면 FE 의 API base 를 dev 로 돌려야
          #   한다. FE 프리뷰 배포가 따로 생기면 그때 환경별로 값을 갈라 준다.
          #   (docs/share-link-deeplink-plan.md §7)
          SHARE_LINK_BASE_URL: ${{ vars.SHARE_LINK_BASE_URL }}
          # 링크 수명(ISO-8601 Duration). 비우면 앱 기본값 P7D. 0 이하면 무기한(expiresAt: null).
          SHARE_LINK_TTL: ${{ vars.SHARE_LINK_TTL }}
          JWT_ACCESS_TTL: ${{ vars.JWT_ACCESS_TTL }}
          JWT_REFRESH_TTL: ${{ vars.JWT_REFRESH_TTL }}
        run: |
          umask 077
          : > was.env
          for k in DB_URL JWT_SECRET JWT_ACCESS_TTL JWT_REFRESH_TTL \
                   GOOGLE_CLIENT_ID GOOGLE_CLIENT_SECRET GOOGLE_REDIRECT_URI \
                   GOOGLE_MAPS_API_KEY \
                   APPLE_CLIENT_ID APPLE_TEAM_ID APPLE_KEY_ID APPLE_PRIVATE_KEY \
                   AI_BASE_URL INTERNAL_API_KEY AI_COURSE_PROVIDER \
                   JPA_DDL_AUTO GEOCODE_PROVIDER GEOCODE_OSM_USER_AGENT \
                   GEOCODE_SEARCH_NEARBY_URL PLACE_PROVIDER \
                   PROFILE_IMAGE_PROVIDER PROFILE_IMAGE_S3_BUCKET PROFILE_IMAGE_S3_REGION \
                   PROFILE_IMAGE_BASE_URL SHARE_LINK_BASE_URL SHARE_LINK_TTL; do
            v="${!k}"
            [ -n "$v" ] && printf '%s=%s\n' "$k" "$v" >> was.env
          done
          # 필수 키 누락은 여기서 끊는다(#27 인시던트: 누락이 rollout 5분 타임아웃으로만 드러남).
          # DB_USERNAME/DB_PASSWORD 는 db-credentials 가 채우므로 검사 대상이 아니다.
          #
          # GOOGLE_MAPS_API_KEY 는 GEOCODE_PROVIDER=google 일 때만 필수다(prod job 주석 참고).
          # 빈 값이면 배포는 통과하는데 취향 분석·코스 생성이 REQUEST_DENIED 로 전부 죽는다.
          missing=""
          required_secrets="DB_URL JWT_SECRET INTERNAL_API_KEY"
          # 한 키를 두 곳이 쓴다 — geocode.google.api-key 와 place.google.api-key 가 모두
          # ${GOOGLE_MAPS_API_KEY} 다. 그래서 둘 중 하나라도 google 이면 필수다.
          # PLACE_PROVIDER 쪽이 오히려 더 나쁘다: GooglePlaceLookupClient 는 조회 실패를
          # 예외가 아니라 빈 값으로 돌려주므로(포트 계약), 키가 없으면 403 을 삼킨 채 장소가
          # 가짜 좌표로 **DB 에 저장**되고 provider 를 고쳐도 복구되지 않는다.
          # if 문으로 감싼다. `grep && x=y` 로 쓰면 provider 가 google 이 아닐 때 AND 리스트가
          # 비0으로 끝나고, GitHub Actions 의 기본 셸이 `bash -e` 라 그 자리에서 스텝이 죽는다.
          if grep -q '^GEOCODE_PROVIDER=google$' was.env || grep -q '^PLACE_PROVIDER=google$' was.env; then
            required_secrets="$required_secrets GOOGLE_MAPS_API_KEY"
          fi
          for req in $required_secrets; do
            grep -q "^${req}=" was.env || missing="$missing $req"
          done
          if [ -n "$missing" ]; then
            echo "::error::필수 시크릿 누락 →$missing. GitHub → Settings → Environments(dev) → Secrets 에 설정 후 재실행하세요. (이름만 있고 값이 비어 있어도 누락으로 잡힙니다)"
            rm -f was.env
            exit 1
          fi
          # 아래 variables 는 앱 기본값이 로컬 개발용이라 미설정 시 조용히 잘못 뜬다.
          #   JPA_DDL_AUTO   앱 기본 update — dev 는 update 로 둔다(스키마가 자주 바뀌는 단계라
          #                  배포마다 손으로 DDL 을 넣지 않는다). 그래도 명시적으로 고른 값이어야 한다.
          #   AI_BASE_URL    앱 기본 localhost:8000 → AI 호출 전부 실패
          #   GEOCODE_PROVIDER 앱 기본 stub → 지오코딩이 가짜 좌표/주소 반환
          #   PROFILE_IMAGE_* 앱 기본 provider=stub → 프로필 이미지가 열리지 않는 합성 URL 로
          #                    '저장'되고, 사용자가 다시 올리기 전까지 복구되지 않는다.
          #                    s3 로 쓰려면 버킷·공개 base URL 이 함께 있어야 한다.
          #   PLACE_PROVIDER   앱 기본 stub → 코스 장소가 가짜 좌표로 '저장'된다(지오코딩과
          #                    달리 DB에 남고 재조회하지 않아 provider를 바꿔도 복구되지 않는다)
          missing_vars=""
          for req in JPA_DDL_AUTO AI_BASE_URL GEOCODE_PROVIDER PLACE_PROVIDER \
                     PROFILE_IMAGE_PROVIDER PROFILE_IMAGE_S3_BUCKET PROFILE_IMAGE_BASE_URL; do
            grep -q "^${req}=" was.env || missing_vars="$missing_vars $req"
          done
          if [ -n "$missing_vars" ]; then
            echo "::error::필수 변수 누락 →$missing_vars. GitHub → Settings → Environments(dev) → Variables (또는 repo Variables) 에 설정 후 재실행하세요."
            rm -f was.env
            exit 1
          fi
          kubectl -n "$K8S_NAMESPACE" create secret generic was-secrets \
            --from-env-file=was.env --dry-run=client -o yaml | kubectl apply -f -
          rm -f was.env

      # CD 는 이미지 태그만 교체한다. apply -k / 전체 매니페스트 재apply 금지.
      - name: Set image
        id: set_image
        run: |
          before="$(kubectl -n "$K8S_NAMESPACE" get deployment "$DEPLOYMENT_NAME" \
            -o jsonpath="{.spec.template.spec.containers[?(@.name=='${CONTAINER_NAME}')].image}")"
          kubectl -n "$K8S_NAMESPACE" set image \
            "deployment/${DEPLOYMENT_NAME}" \
            "${CONTAINER_NAME}=${IMAGE}"
          # 같은 커밋을 다시 배포하면(workflow_dispatch 재실행, 시크릿만 고친 경우) set image 가
          # no-op 이라 롤아웃이 일어나지 않는다. 그러면 방금 만든 was-secrets 가 돌고 있는 파드에
          # 반영되지 않은 채 'Verify rollout' 이 즉시 성공한다 — 워크플로도 파드도 초록불인데
          # 설정만 옛 값인 상태다(2026-08-27 GOOGLE_MAPS_API_KEY 인시던트: 값을 채우고 재배포했는데
          # 증상이 그대로였다). Reloader 는 db-credentials 만 보므로 여기서 처리한다.
          # 이미지가 바뀐 경우에는 그 롤아웃이 이미 새 시크릿을 물고 뜨므로 재시작하지 않는다
          # (하면 롤아웃이 두 번 돈다).
          # ⚠️ 이 경로에서 파드가 죽으면 아래 'Rollback on failure' 는 구제하지 못한다. was-secrets
          #    는 이미 클러스터에서 덮어써졌고 rollout undo 는 파드 템플릿만 되돌리므로, 되살아난
          #    파드도 같은(잘못된) 시크릿을 물고 똑같이 죽는다. 설정이 원인일 때는 undo 가 아니라
          #    값을 고쳐 다시 배포해야 한다.
          if [ "$before" = "$IMAGE" ]; then
            echo "이미지 동일($IMAGE) — was-secrets 반영을 위해 rollout restart 한다."
            kubectl -n "$K8S_NAMESPACE" rollout restart "deployment/${DEPLOYMENT_NAME}"
          fi

      # 무중단(rolling) rollout 검증. dev 도 prod 와 같은 grace 90s 설정을 상속한다.
      - name: Verify rollout
        run: kubectl -n "$K8S_NAMESPACE" rollout status "deployment/${DEPLOYMENT_NAME}" --timeout=5m

      # prod 와 동일: 이미지를 실제로 교체한 뒤 실패한 경우에만 되돌린다.
      - name: Rollback on failure
        if: failure() && steps.set_image.outcome == 'success'
        run: |
          echo "rollout failed — rolling back deployment/${DEPLOYMENT_NAME} (app-dev)"
          kubectl -n "$K8S_NAMESPACE" rollout undo "deployment/${DEPLOYMENT_NAME}"
          kubectl -n "$K8S_NAMESPACE" rollout status "deployment/${DEPLOYMENT_NAME}" --timeout=5m
